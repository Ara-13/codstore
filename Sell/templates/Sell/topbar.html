<html>
    <head>
        <meta charset="UTF-8" />
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic&display=swap');
            body
            {
                margin: 0px;
                padding: 0px;
                
            }
            #ul1
            {
                list-style: none;
                margin-top: 0px;
                width: 100%;
                height: 50px;
                background-color: #f2f2f2;
                position: fixed;
                box-shadow: 0 5px 30px 0 gray;
                font-family: 'Noto Sans Arabic', sans-serif;
            }
            #ul1 > li
            {
                float: left;
                width: 100px;
                height: 43px;
                padding-top: 10px;
                text-align: center;
                cursor: pointer;
                color: #3477ac;
                /*box-shadow: 1px 0 5px 0 #3477ac;*/
                transition: all ease-in 0.1s;
                display: inline-block;
            }
            #ul1 > li::after
            {
                content: '';
                width: 0;
                height: 3px;
                margin-top: 8px;
                display: block;
                background-color: #33ccff;
                box-shadow: 0 -2px 10px 0 #33ccff;
            }
            #ul1 > li:hover
            {
                color: #33ccff;
                background-color: #e6e6e6;
                padding-top: 7px;
            }
            #ul1 > li:hover::after
            {
                width: 100%;
            }
            #ul1 li div
            {
                width: auto;
                height: auto;
                position: absolute;
                top: 50px;
                left: 40px;
                background-color: #f2f2f2;
                padding: 10px;
                padding-left: 0px;
                display: none;
                border-bottom-left-radius: 5px;
                border-bottom-left-radius: 5px;
            }
            #ul1 li:hover div
            {
                display: block;
                color: #3477ac;
            }
            #ul1 li ul
            {
                list-style: none;
                padding-left: 0px;
            }
            #ul1 li ul li
            {
                margin-top: 5px;
                padding: 15px;
                transition: all ease-in-out 0.1s;
            }
            #ul1 li ul li:hover
            {
                color: #33ccff;
                border-left: solid 3px #33ccff;
                background-color: #e6e6e6;
            }
            #ul1 a
            {
                text-decoration: none;
                color: #3477ac;
                display: block 
            }
            #ul1 a:hover
            {
                color: #33ccff;
            }
        </style>
    </head>
    <body>
        <ul id="ul1">
            <li id="accounts">Accounts
            <div>
                <ul>
                    <li><a href="">Account 1</a></li>
                    <li>Account 2</li>
                    <li>Account 3</li>
                    <li>Account 4</li>
                    <li>Account 5</li>
                </ul>
            </div>
            </li>
            {% if request.user.is_authenticated%}
            <li><a href="/form">Sell Account</a></li>
            <li><a href="/logout">Logout</a></li>
            {% else %}
            <li><a href="/login">Login</a></li>
            {% endif %}
            <li>Filters</li>
        </ul>
    </body>
</html>
